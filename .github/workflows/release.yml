name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 真机验证：Linux 装 simavr 跑 examples/assert-blink-toggles
  # 这是 release 前的硬关卡，不过不让发
  verify:
    name: Verify (Linux + simavr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install simavr/qemu/arm gcc + bridge build deps
        run: sudo apt-get update && sudo apt-get install -y simavr libsimavr-dev libelf-dev qemu-system-arm gcc-arm-none-eabi

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install arduino:avr core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: cargo test
        run: cargo test --all-targets

      # v3 M1:MCP server stdio 冒烟(纯 Rust,无需 simavr)
      - name: MCP server smoke (initialize + tools/list)
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | cargo run --release -- mcp 2>/dev/null | grep -q '"board_info"'

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build --release
        run: cargo build --release

      - name: Build simavr bridge (Linux)
        run: |
          make -C bridge
          ls -la bridge/moxin-simavr-bridge
          echo "MOXIN_BRIDGE=$GITHUB_WORKSPACE/bridge/moxin-simavr-bridge" >> $GITHUB_ENV

      - name: Smoke test moxin doctor (non-blocking)
        run: |
          # 注：此阶段 bridges 尚未 build，doctor 必报缺失；
          # simavr --help 在 Ubuntu noble 上返回非零，也会被探针误判。
          # 真正硬关卡是下面的 Real-sim verify，这里只做信息性检查。
          which simavr || true
          simavr --help 2>&1 | head -5 || true
          echo "exit code of simavr --help: $?"
          ./target/release/moxin doctor || echo "(doctor non-zero is expected at CI smoke stage)"

      - name: Real-sim verify (assert-blink-toggles)
        working-directory: examples/assert-blink-toggles
        run: |
          ../../target/release/moxin build
          # 后台启动 run --output json，assert 看退出码
          ../../target/release/moxin run --output json &
          RUN_PID=$!
          sleep 2
          ../../target/release/moxin assert --pin D13 --toggles --within 3s
          ASSERT_EXIT=$?
          kill $RUN_PID 2>/dev/null || true
          exit $ASSERT_EXIT

      # v0.5.0 起:验证 AVR bridge 的 UART → serial 事件(bridge protocol "1")
      # assert 自己拉起仿真,不需要后台 run
      - name: Real-sim verify (assert-serial-hello, UART serial events)
        working-directory: examples/assert-serial-hello
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --serial-contains "hello" --within 5s

      # v0.6.0 起:验证 HC-SR04 echo 回波调度(bridge sr04/dist 命令 + cycle timer)
      # 未注入时 bridge 默认 50cm → 固件 pulseIn 应读出 cm=50 上下
      - name: Real-sim verify (ultrasonic-radar, SR04 echo timing)
        working-directory: examples/ultrasonic-radar
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --serial-contains "cm=" --within 5s

      # v0.7.0 起:验证 DHT11 单总线时序(bridge dht/env 命令 + 边沿回放器)
      # 未注入时 bridge 默认 25°C/60% → 固件 bit-bang 读 + checksum 应打出 temp=
      - name: Real-sim verify (dht11-weather, one-wire timing)
        working-directory: examples/dht11-weather
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --serial-contains "temp=" --within 5s

      # v0.7.0 起:验证红外 NEC 时序(bridge ir/irtx 命令,声明后 500ms 自检帧)
      - name: Real-sim verify (ir-remote, NEC timing)
        working-directory: examples/ir-remote
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --serial-contains "code=20DF10EF" --within 5s

      # v0.7.0 起:验证 LCD1602 TWI 从机(每次 endTransmission 必须被 ACK)
      - name: Real-sim verify (lcd-hello, TWI slave ACK)
        working-directory: examples/lcd-hello
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --serial-contains "lcd ok" --within 5s

      # v0.7.0 起:验证 OLED SSD1306 TWI 从机(命令流 + 1024 字节数据全 ACK)
      - name: Real-sim verify (oled-hello, SSD1306 TWI slave)
        working-directory: examples/oled-hello
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --serial-contains "oled ok" --within 5s

      # 串口 RX 注入:assert --send 注入 'Z' → serial-echo 回显 "echo: Z"(自包含)
      - name: Real-sim verify (serial-echo, RX injection)
        working-directory: examples/serial-echo
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --serial-contains "echo: Z" --send Z --within 5s

      # 非 D13 GPIO 断言:multi-led-chase 持续翻转 D2..D7,断言 D2 翻转
      - name: Real-sim verify (multi-led-chase, non-D13 pin assert)
        working-directory: examples/multi-led-chase
        run: |
          ../../target/release/moxin build
          ../../target/release/moxin assert --pin D2 --toggles --within 3s

      # v3 M2:AI 经 MCP 端到端驱动仿真(build → run → inject adc → sim_state)
      - name: MCP e2e (drive adc-potentiometer via MCP)
        run: python3 scripts/mcp_smoke.py ./target/release/moxin examples/adc-potentiometer

      # v3.2:AI Inspector `moxin explain` shell-out 闭环(假 curl 冒充 LLM,不打真 API)
      - name: AI Inspector explain (fake-curl shell-out)
        working-directory: examples/adc-potentiometer
        run: |
          mkdir -p fakebin build
          cat > fakebin/curl <<'SH'
          #!/bin/bash
          if [ "$1" = "--version" ]; then echo "curl 8.0.0 (fake)"; exit 0; fi
          cat >/dev/null   # drain request body from stdin
          printf '%s' '{"content":[{"type":"text","text":"D13 blink loop, no anomalies."}]}'
          SH
          chmod +x fakebin/curl
          echo '{"ready":true,"mcu":"atmega328p","pin_states":{"B:5":1}}' > build/.moxin-state.json
          OUT=$(PATH="$PWD/fakebin:$PATH" MOXIN_LLM_API_KEY=sk-fake ../../target/release/moxin explain)
          echo "anthropic explain output: $OUT"
          echo "$OUT" | grep -q "no anomalies" || { echo "anthropic explain shell-out failed"; exit 1; }
          # OpenAI 兼容方言:fake curl 回 OpenAI choices[0].message.content 形态
          cat > fakebin/curl <<'SH2'
          #!/bin/bash
          if [ "$1" = "--version" ]; then echo "curl 8.0.0 (fake)"; exit 0; fi
          cat >/dev/null
          printf '%s' '{"choices":[{"message":{"role":"assistant","content":"openai path ok."}}]}'
          SH2
          chmod +x fakebin/curl
          OUT2=$(PATH="$PWD/fakebin:$PATH" MOXIN_LLM_DIALECT=openai MOXIN_LLM_API_KEY=sk-fake ../../target/release/moxin explain)
          echo "openai explain output: $OUT2"
          echo "$OUT2" | grep -q "openai path ok" || { echo "openai explain shell-out failed"; exit 1; }
          # 未设 key 时必须默认关闭(不发请求,给指引,exit 0)
          env -u MOXIN_LLM_API_KEY ../../target/release/moxin explain | grep -q "未启用"

  # 三平台构建二进制
  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: moxin
            asset: moxin-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: moxin
            asset: moxin-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: moxin
            asset: moxin-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: moxin.exe
            asset: moxin-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }} ${{ matrix.artifact }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # 发布 release
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          NOTES_FILE="RELEASE_NOTES_v${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "file=$NOTES_FILE" >> $GITHUB_OUTPUT
          else
            echo "file=" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ steps.notes.outputs.file }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
