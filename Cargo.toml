[package]
name = "moxin"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
anyhow = "1"
rustyline = "14"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
