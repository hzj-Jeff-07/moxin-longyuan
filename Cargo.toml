[package]
name = "moxin"
version = "0.3.0"
edition = "2021"
license-file = "LICENSE"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
anyhow = "1"
rustyline = "14"
ratatui = "0.30"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
