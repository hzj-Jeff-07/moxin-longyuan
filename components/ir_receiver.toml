# 红外接收头 · components/ir_receiver.toml
# Phase 3 批次 B 第 2 件(v0.7.0)
# 型号：VS1838B(38kHz 载波,NEC 协议)

[component_type]
id = "ir_receiver"
display_name = "IR Receiver (VS1838, NEC)"
category = "input"
description = "红外接收头:out 输出解调后的 NEC 波形(空闲高,载波段拉低)"
schema_version = "1.0"

[[pin]]
name = "out"
aliases = ["data", "signal", "1"]
electrical = "digital_out"
direction = "out"
required = true

[[pin]]
name = "gnd"
aliases = ["g", "2"]
electrical = "gnd"
direction = "in"
required = true

[[pin]]
name = "vcc"
aliases = ["v", "3"]
electrical = "power"
direction = "in"
required = true

# --- 运行时状态 ---

[[state_field]]
name = "last_code"
type = "string"
default = ""
description = "最近一帧 NEC 码(8 位十六进制,ir 命令注入)"

# --- 备注 ---
# out 引脚映射由 moxin 启动时经 stdin `ir <P> <B>` 自动下发,声明后
# bridge 500ms 自发一帧自检码 20DF10EF;之后用 REPL `ir <hex32>` 发码。
# 波形按真实 NEC 时序回放(9ms 引导 + 4.5ms 空 + 32bit,字节内 LSB 先发)。
